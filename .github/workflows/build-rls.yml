name: Build Desktop (Flutter)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch, tag, or sha) to build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      is_tag: ${{ steps.ref.outputs.is_tag }}
      tag_name: ${{ steps.ref.outputs.tag_name }}
    steps:
      - name: Checkout (for tag detection)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || github.ref }}"

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          TAG=""
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          else
            TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi

          if [[ -n "$TAG" ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (auto notes)
        id: release
        if: ${{ steps.ref.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    runs-on: ${{ matrix.os }}
    needs: prepare
    concurrency:
      group: build-${{ matrix.os }}-${{ needs.prepare.outputs.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS 15 (Apple Silicon)
            asset: dataset_inspector-macos-aarch64.zip
          - os: macos-15-intel
            label: macOS 15 (Intel)
            asset: dataset_inspector-macos-x86_64.zip
          - os: ubuntu-24.04
            label: Linux
            asset: dataset_inspector-linux-x86_64.tar.gz
          - os: windows-latest
            label: Windows
            asset: dataset_inspector-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop platforms
        run: flutter config --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/apple_cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -p codesigning "$KEYCHAIN_PATH"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Sign + notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="Dataset Inspector.app"
          APP_PATH="build/macos/Build/Products/Release/${APP_NAME}"
          /usr/bin/codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$APPLE_DEVELOPER_ID" \
            "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          NOTARIZE_ZIP="$RUNNER_TEMP/dataset-inspector-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_NAME="Dataset Inspector.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/${APP_NAME}" \
            "${{ matrix.asset }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C build/linux/x64/release/bundle -czf "${{ matrix.asset }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload Release Asset
        if: ${{ needs.prepare.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: ${{ matrix.asset }}

  manifest:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.is_tag == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Build latest.json
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION="${RAW_VERSION%%+*}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "url": "${BASE_URL}/dataset_inspector-macos-aarch64.zip" },
              "darwin-x86_64": { "url": "${BASE_URL}/dataset_inspector-macos-x86_64.zip" },
              "windows-x86_64": { "url": "${BASE_URL}/dataset_inspector-windows-x86_64.zip" },
              "linux-x86_64": { "url": "${BASE_URL}/dataset_inspector-linux-x86_64.tar.gz" }
            }
          }
          EOF

      - name: Upload latest.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: latest.json
