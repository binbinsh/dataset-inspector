name: dataset_inspector
description: Desktop UI for inspecting local and remote dataset shards.
version: 2.5.1+20260129
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  collection: ^1.18.0
  crypto: ^3.0.3
  file_picker: ^10.3.8
  ffi: ^2.1.0
  google_fonts: ^8.0.1
  http: ^1.2.2
  mime: ^2.0.0
  open_filex: ^4.4.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  window_manager: ^0.3.8
  zstd: ^0.0.1-dev.2
  dart_duckdb: ^1.4.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - images/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-SemiBold.ttf
          weight: 600
